<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Önder Nuray</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/google-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/not-found.js" defer></script>
</head>
<body>
  <!-- GitHub Pages serves this file for every address that does not exist, at any depth, so all paths here start with a slash. -->
  <main id="main" class="section notfound-page">
    <div class="container">
      <div class="card">
        <p class="notfound-code" aria-hidden="true">404</p>
        <h1 id="nf-title">Page not found</h1>
        <p id="nf-text">The page you are looking for could not be found. The address may be mistyped, or the page may have been moved or removed.</p>
        <div class="cta-row">
          <a class="btn btn-primary" id="nf-home" href="/">Back to the homepage</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
