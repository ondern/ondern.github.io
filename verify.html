<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="verify.pageTitle">Confirm your message | Önder Nuray</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.nuray.io; form-action 'none'; base-uri 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/google-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/verify.js"></script>
</head>
<body>
  <main id="main" class="section verify-page">
    <div class="container">
      <div class="card">
        <h1 data-i18n="verify.title">Confirm your message</h1>
        <p id="verify-intro" data-i18n="verify.intro">Press the button to confirm your email address and send your message. Each link works once and is valid for 15 minutes.</p>
        <div id="verify-status" class="form-status" role="status" aria-live="polite"></div>
        <div class="cta-row">
          <button type="button" class="btn btn-primary" id="verify-btn" data-i18n="verify.button">Confirm and send</button>
        </div>
        <p><a id="verify-home" href="./" data-i18n="verify.home">Back to the website</a></p>
      </div>
    </div>
    <noscript><p class="banner" role="note"><span lang="en">JavaScript is required to confirm your message.</span> <span lang="de">Zum Bestätigen Ihrer Nachricht ist JavaScript erforderlich.</span> <span lang="tr">Mesajınızı onaylamak için JavaScript gereklidir.</span></p></noscript>
  </main>
</body>
</html>
